name: Validate calendar before publication

on:
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety checks
        run: python -m unittest discover -s tests -v
      - name: Verify approved calendar configuration
        run: python scripts/publish.py
